version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
