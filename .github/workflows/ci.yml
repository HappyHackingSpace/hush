name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint --strict
      - name: Test HushCore
        run: swift test
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Hush.xcodeproj -scheme Hush \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
